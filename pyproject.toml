[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghost-hands"
version = "0.3.0"
description = "Governed agent hands for the web: numbered element maps, classified actions, an approval governor, and a replayable provenance trail."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Ghost Developer Studio" },
]
keywords = ["browser-automation", "agent", "cdp", "mcp", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.scripts]
ghost-hands = "ghost_hands.cli:main"

[project.urls]
Homepage = "https://github.com/littlestjames82-sys/ghost-hands"
Repository = "https://github.com/littlestjames82-sys/ghost-hands"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
